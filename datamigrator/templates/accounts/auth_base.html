{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ante{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <script>
  (function(){
    var t=localStorage.getItem('ante_theme'),h=document.documentElement;
    if(t==='dark'){h.setAttribute('data-theme','dark');h.setAttribute('data-bs-theme','dark');}
    else if(t==='light'){h.setAttribute('data-theme','light');h.setAttribute('data-bs-theme','light');}
    else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){h.setAttribute('data-bs-theme','dark');}
  }());
  </script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="panel auth-card">
      <div class="auth-brand mb-4">
        <img src="{% static 'img/logo.svg' %}" alt="" class="auth-logo">
        <span>Ante</span>
      </div>
      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</body>
</html>
